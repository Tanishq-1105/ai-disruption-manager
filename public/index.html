<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel-Disruption Concierge — Simulator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">Travel-Disruption Concierge</div>
      <div class="brand-subtitle">Simulator &amp; control panel</div>
    </div>
    <div class="topbar-controls">
      <span id="status-pill" class="status-pill status-idle">
        <span class="status-dot"></span>
        <span id="status-text">idle</span>
      </span>
      <button id="seed-demo" class="btn btn-primary">Seed demo trip</button>
      <button id="fail-next" class="btn btn-warning">Force next booking failure</button>
      <button id="refresh-now" class="btn btn-ghost">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel trip-panel">
      <div class="panel-header">
        <h2>Trip</h2>
        <span id="trip-id-label" class="muted">no trip loaded</span>
      </div>
      <div id="trip-nodes" class="node-list">
        <p class="empty-state">Click "Seed demo trip" to load a trip with a connecting flight, hotel, ground transport, and a commitment.</p>
      </div>
    </section>

    <section class="panel analysis-panel">
      <div class="panel-header">
        <h2>Watcher &amp; Impact Analysis</h2>
        <span class="muted">polls every 2s</span>
      </div>
      <div id="analysis-events" class="event-list">
        <p class="empty-state">No trip loaded yet.</p>
      </div>
    </section>
  </main>

  <footer class="raw-state">
    <details>
      <summary>Raw simulator state</summary>
      <pre id="raw-state">{}</pre>
    </details>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
